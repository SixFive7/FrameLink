# FrameLink Fleet Manager — production stack (version2.md §3.8, milestone Mn+2).
#
# ═════════════════════════════════════════════════════════════════════════════════════════════
#  INERT. NOTHING IN THIS FILE IS LIVE CONFIGURATION, AND NOTHING IN IT IS A PENDING ACTION.
#
#  Deployment onto the operator's server is DEFERRED until a release has been cut. Until that
#  day this file is a record of a design that was worked out and reviewed, not an instruction to
#  do anything: no value in it is applied anywhere, no placeholder in it is waiting to be filled
#  in, and the /24, the gateway, the IPv4 and the MAC below are questions for deployment day
#  rather than choices anybody needs to make now.
#
#  The Fleet Manager that is actually running lives on the author's workstation under Docker,
#  described by framelink.dev.yml and docs/15-local-fleet-manager.md. That is the file to read
#  and the one to change.
#
#  Everything below about Traefik, Authelia, the certificate resolver, the trusted-proxy address
#  and the dfw.rules firewall block was derived from the operator's own repository and is kept
#  BECAUSE it was expensive to work out and will be correct again when it is needed. It must be
#  RE-VERIFIED against that repository on deployment day before any of it is believed: an estate
#  moves, and a value that was true months ago and is quietly wrong now is worse than no value.
# ═════════════════════════════════════════════════════════════════════════════════════════════
#
# Authored against the operator's PortainerCompose repository as it stood when this was written:
# an own /24 bridge from that repo's config/networks.yaml, a pinned IPv4 and MAC on its formula,
# a .254 gateway, single-homed, a dfw.rules label in that repo's §4 schema, and cross-stack reach
# only through declared pinholes. Secrets are never defaulted here; the estate's own naming (the
# certificate resolver, the entrypoints, Traefik's address) carries a default, because those were
# facts about that estate rather than guesses.
#
# ── WHAT THE OPERATOR'S REPO SETTLED, AND WHAT IT LEFT OPEN ──────────────────────────────────
# Settled, and applied below: entrypoints are `http` (:80) and `https` (:443, asDefault); the
# certificate resolver is `letsencrypt`; Authelia is `authelia@file` bound to the HTTPS
# ENTRYPOINT, so every HTTPS router inherits it and the opt-out idiom is an empty middlewares
# label; Traefik is single-homed at 172.16.23.253 and reaches apps by routing to their pinned IP;
# the MAC formula is `02:42:` + the four IPv4 bytes in hex; `.100` is the main service and `.254`
# is the gateway; `traefik.docker.network` is forbidden fleet-wide (validator F23).
#
# Left open, and left open deliberately: which /24 this stack gets. That registry is
# alphabetical-sequential, and `framelink` sorts between `fossflow` and `frigate` — so the
# by-the-book slot renumbers two dozen downstream stacks, Traefik's own among them, and the
# alternative is appending at the end and accepting an alphabetical break. It is a deployment-day
# question with a real cost either way, it is the operator's to answer then, and stack.env.example
# sets out both options with every derived value already computed so that answering it is a
# minute's work rather than an afternoon's. It is not an outstanding task.
#
# ── HOW IT WOULD BE DEPLOYED, WHEN THAT DAY COMES ────────────────────────────────────────────
#   1. Re-verify every estate-derived value below against the operator's own repository.
#   2. docker volume create framelink-data          (once, on the Docker host)
#   3. Portainer → Stacks → Add stack → Web editor → paste this file
#   4. Fill in the environment variables from stack.env.example in Portainer's own
#      "Environment variables" panel. THE SECRETS ARE TYPED THERE AND NOWHERE ELSE.
#   5. Deploy.
# Full walkthrough, with what to check after each step: docs/14-fleet-manager-deployment.md
#
# ── IF THIS STACK IS ADOPTED INTO THE PortainerCompose REPO ──────────────────────────────────
# The firewall generator there (scripts/dfw-gen.py) walks `stacks/*.yml` STATICALLY with
# yaml.safe_load — it never expands a `${VAR}`, and it finds a stack's own bridge by looking for
# a network key literally named `default`. So the dfw.rules label below is inert until a copy of
# this file lives at `stacks/framelink.yml` in that repo with the addresses written out as
# literals. The network key is already `default` here so that copy is a substitution, not a
# rewrite.
#
# ── WHY THE VOLUME IS `external` ─────────────────────────────────────────────────────────────
# It holds the SQLite database, and that database holds every adopted frame's identity, settings
# and call token. Losing it does not lose "some data" — it orphans the entire fleet, because §3.3
# makes identity the keypair and a Fleet Manager that has forgotten a keypair sees that frame
# reappear as a stranger in the adoption queue. An `external: true` volume is one Compose will
# never create, never adopt and never remove: `docker compose down -v`, a Portainer "remove the
# stack" with volumes ticked, and a mistyped stack name all leave it exactly where it was. The
# cost is one command on first deploy, which is the cheapest insurance in this file.
#
# ── WHAT TRAEFIK CANNOT CARRY, AND WHAT IS DONE ABOUT IT ─────────────────────────────────────
# Two things, and they fail in different ways:
#
#   1. THE AGENT WEBSOCKET can ride Traefik — it is an ordinary HTTP/1.1 Upgrade — but it must
#      not meet Authelia. §3.8: "Authelia cannot sit in front of the agent route" because a frame
#      is a machine with a keypair and no browser to complete an interactive SSO flow. So there
#      are two routers on one service: the GUI router carries the Authelia middleware, and the
#      /agent router carries none and authenticates by device keypair instead. Traefik's default
#      priority is rule length, which already puts the longer /agent rule first; both priorities
#      are stated explicitly anyway, because "it happens to sort correctly" is not a property to
#      leave a fleet's connectivity resting on.
#
#   2. WEBRTC MEDIA cannot ride it at all. A reverse proxy terminates TCP; call media is UDP, and
#      §3.7 calls that split unavoidable. So the UDP range and the TCP fallback are published on
#      the host directly, one-to-one — the same shape guide 7's standalone stack used and guide 8
#      validated end to end. One-to-one matters, and it is the PORT NUMBERS that make it matter:
#      LiveKit runs with `use_external_ip: false` and is told this host's address as `node_ip`, so
#      its ICE candidates name the address frames dial — but the port in each candidate is the one
#      it bound inside the container. Remap 50000-50059 to anything else and every candidate names
#      a port that arrives nowhere, so calls connect for nobody, with no error anywhere.
#
# ── WHAT ELSE MAY BE HOLDING THESE HOST PORTS, ON DEPLOYMENT DAY ─────────────────────────────
# 7880, 7881 and 50000-50059 are published on the host directly, so anything else already bound
# to them is a bind failure rather than a degradation — Docker refuses to start the second
# claimant and says which port. That is a good failure: loud, immediate, and answered before
# anything else is attempted. What is holding them, if anything, is a fact about that host on the
# day, so it is checked then rather than assumed now, and this file does not model it. §3.7's
# escape hatch is the answer if an existing call server is to be kept: set FRAMELINK_LIVEKIT_URL,
# FRAMELINK_LIVEKIT_API_KEY and FRAMELINK_LIVEKIT_API_SECRET and delete the three `ports:`
# entries below, since nothing in this container then listens on them.
#
# Signalling (7880) is the one piece that could go either way. It is published directly here,
# which is what makes the LAN case work with no certificate and no name, exactly as guide 7 did.
# Routing it through Traefik as `wss://` is a supported alternative — add a third router for
# PathPrefix(`/rtc`) and set FRAMELINK_LIVEKIT_PUBLIC_URL to the https origin — and it buys
# encryption of the token exchange, not of the call, because the media still goes direct. That
# trade belongs to Appendix B item 2 (cross-household connectivity), which is deferred within v2.

services:
  framelink:
    image: ${FRAMELINK_IMAGE}
    container_name: framelink
    hostname: framelink
    restart: unless-stopped

    # tini as PID 1. The Fleet Manager supervises livekit-server as a child process (§3.7), so
    # this container has a process tree rather than a process — and PID 1 in a container inherits
    # every orphan on the host's behalf. .NET reaps the children it started itself; tini is what
    # covers anything it did not, for the price of a 10 kB binary.
    init: true

    # The database is mid-write when a redeploy arrives, and the call server is a child that
    # deserves to be asked before it is killed. Thirty seconds is far more than either needs and
    # costs nothing on a graceful stop, which is the only case where it is spent.
    stop_grace_period: 30s

    security_opt:
      - no-new-privileges:true

    # Nothing in the image needs a capability the default set does not already grant. Stated
    # rather than assumed, because §3.9's whole argument for image generation being affordable is
    # that debugfs and mcopy work with no --privileged and no --cap-add, and a stack that quietly
    # granted one would make that claim untestable in the place it actually runs.
    cap_drop:
      - ALL

    environment:
      # ── The one variable that must be set (§3.2, decision 43) ──────────────────────────────
      # Supplied by Portainer's environment panel. Never in this file, never in the image.
      FRAMELINK_OPERATOR_PASSWORD: ${FRAMELINK_OPERATOR_PASSWORD}

      # ── Paths inside the container ────────────────────────────────────────────────────────
      # The volume mount point. Everything precious is under it: framelink.db, and the LiveKit
      # binary with its generated configuration.
      FRAMELINK_DATA_DIR: /var/lib/fl-control

      # §3.9's images, and the reason they are not under the line above. The generator holds three
      # image-sized files at once — the 2.8 GB pinned base, a working copy and the artifact — and
      # unset, this defaults to FRAMELINK_DATA_DIR/images, which puts nine gigabytes of scratch on
      # the volume §3.1 budgeted for a SQLite database and beside the only thing in this stack
      # that cannot be rebuilt. The second volume is not external for exactly the reason the first
      # one is: everything on it is re-downloadable and re-generatable, so Compose is welcome to
      # reclaim it, and the volume it must never reclaim is one Compose does not own.
      FRAMELINK_IMAGE_DIR: /var/lib/fl-images

      # ── The per-IP rate limiter behind a reverse proxy (§3.3) ─────────────────────────────
      # The registration endpoint is fully open and internet-exposed, and per-IP rate limiting is
      # the only thing standing between it and unbounded noise. Behind Traefik every request
      # arrives from Traefik, so without this the whole internet shares one budget — and with it
      # set to anything other than Traefik's real address, an attacker forges X-Forwarded-For and
      # presents a fresh source per request.
      #
      # It defaults, because the operator's repo settled it when this was written: Traefik is
      # single-homed at 172.16.23.253 on the reverseproxy bridge and reaches every other stack by
      # ROUTING to its pinned IP, with the source address preserved across the bridge — the whole
      # cross-stack policy layer is IP-pair accepts, and the estate hardened it with strict
      # reverse-path filtering precisely because that source address functions as a credential.
      # So the address this container observes for a proxied request is Traefik's own.
      #
      # INERT until deployment day, and RE-VERIFY IT THEN. This default is a fact about one
      # estate at one moment; it is not applied anywhere today, and a stale value here is not a
      # cosmetic error — the wrong address makes §3.3's per-IP budget forgeable by a header. The
      # development stack sets this to the empty string, which is the correct value when there is
      # no proxy at all. See framelink.dev.yml.
      FRAMELINK_TRUSTED_PROXIES: ${FRAMELINK_TRUSTED_PROXIES:-172.16.23.253}

      # ── Calling (§3.7) ───────────────────────────────────────────────────────────────────
      # The address frames dial. Not derivable by the container: it knows the addresses it is
      # bound to and nothing about how a frame on the other side of a bridge reaches it. On a LAN
      # this is ws://<the Docker host's LAN address>:7880.
      FRAMELINK_LIVEKIT_PUBLIC_URL: ${FRAMELINK_LIVEKIT_PUBLIC_URL}

      # ── Alerting (§3.5, decision 22) ──────────────────────────────────────────────────────
      # A Home Assistant webhook URL. Unset means alerts are evaluated and written to this
      # container's log and nowhere else, which is a working deployment with a channel nobody
      # reads — so it is listed here rather than left to be discovered.
      FRAMELINK_ALERT_WEBHOOK: ${FRAMELINK_ALERT_WEBHOOK:-}

    volumes:
      - framelink-data:/var/lib/fl-control
      - framelink-images:/var/lib/fl-images

    ports:
      # LiveKit signalling: HTTP and WebSocket. The half a reverse proxy could carry.
      - "${FRAMELINK_LIVEKIT_BIND:-0.0.0.0}:7880:7880/tcp"
      # LiveKit TCP media fallback, for a network that blocks UDP.
      - "${FRAMELINK_LIVEKIT_BIND:-0.0.0.0}:7881:7881/tcp"
      # Where call media actually flows. One-to-one, and the same sixty ports the server writes
      # into livekit.yaml, for the reason in the header.
      - "${FRAMELINK_LIVEKIT_BIND:-0.0.0.0}:50000-50059:50000-50059/udp"

    networks:
      # Both variables are unset and are meant to be. They are not blanks waiting to be filled in
      # — they are the mechanical consequence of the /24 answered on deployment day, and
      # stack.env.example already has both candidates fully computed. Compose refuses to render
      # this file with either one empty, which is the correct behaviour: it means this file cannot
      # be deployed by accident before that question has been answered.
      default:
        ipv4_address: ${FRAMELINK_IPV4}
        mac_address: ${FRAMELINK_MAC}

    labels:
      # ══ EVERY LABEL IN THIS BLOCK IS INERT UNTIL DEPLOYMENT DAY ══════════════════════════
      # A Traefik label with no Traefik reading it does nothing at all, and a dfw.rules block is
      # only ever read by a generator in the operator's own repository that has never seen this
      # file. So none of what follows is live, none of it is a pending action, and the
      # development stack in framelink.dev.yml carries none of it — plain HTTP on a workstation
      # has no router to label and no firewall generator to declare intent to.
      #
      # They are kept because the reasoning behind them is the expensive part and it will be
      # correct again when it is needed. They must be RE-VERIFIED against the operator's own
      # repository before they are believed: the entrypoint names, the resolver name, the
      # Authelia binding and the pinhole schema are all facts about that estate, and an estate
      # moves.
      #
      # ── Traefik: the GUI ─────────────────────────────────────────────────────────────────
      # No `traefik.docker.network` label. It is not merely unnecessary here, it is forbidden
      # fleet-wide: every container in this estate is single-homed, so Traefik's backend pick is
      # never ambiguous, and the operator's validator fails the label outright (rule F23).
      traefik.enable: "true"

      # NO `middlewares` LABEL ON THIS ROUTER, AND ITS ABSENCE IS THE AUTHELIA WIRING.
      # In this estate Authelia is not a per-router middleware — it is `authelia@file`, a
      # forwardAuth bound to the HTTPS ENTRYPOINT in Traefik's static config, which every HTTPS
      # router inherits automatically. Naming a middleware here would REPLACE that inherited set
      # rather than add to it, which is how a router loses Authelia by trying to ask for it.
      traefik.http.routers.framelink-gui.rule: Host(`${FRAMELINK_DOMAIN}`)
      traefik.http.routers.framelink-gui.entrypoints: ${FRAMELINK_ENTRYPOINT:-https}
      traefik.http.routers.framelink-gui.tls: "true"
      traefik.http.routers.framelink-gui.tls.certresolver: ${FRAMELINK_CERT_RESOLVER:-letsencrypt}
      traefik.http.routers.framelink-gui.service: framelink
      traefik.http.routers.framelink-gui.priority: "10"

      # ── Traefik: the device route, deliberately without Authelia (§3.8) ──────────────────
      # A frame authenticates with its keypair over the frozen handshake (§4.2). There is no
      # browser here to complete an interactive SSO flow, so an SSO middleware on this router
      # would not make it more secure — it would make the fleet unable to connect at all.
      #
      # Because Authelia hangs off the entrypoint, "carries no middleware" is NOT the absence of
      # a label — an unlabelled router inherits Authelia and every frame in the fleet gets a 302
      # to authentication.huisman.io that it cannot follow. The opt-out is an EXPLICIT EMPTY
      # middlewares list, which is the same idiom the estate's one other self-authenticating
      # service uses. The empty string is load-bearing; deleting this line breaks the fleet.
      traefik.http.routers.framelink-agent.rule: Host(`${FRAMELINK_DOMAIN}`) && PathPrefix(`/agent`)
      traefik.http.routers.framelink-agent.entrypoints: ${FRAMELINK_ENTRYPOINT:-https}
      traefik.http.routers.framelink-agent.tls: "true"
      traefik.http.routers.framelink-agent.tls.certresolver: ${FRAMELINK_CERT_RESOLVER:-letsencrypt}
      traefik.http.routers.framelink-agent.middlewares: ""
      traefik.http.routers.framelink-agent.service: framelink
      traefik.http.routers.framelink-agent.priority: "100"

      traefik.http.services.framelink.loadbalancer.server.port: "8080"

      # A frame's socket is expected to live for months. Traefik forwards a WebSocket upgrade
      # with no configuration at all, and the only setting that could break one is an idle
      # timeout on the entrypoint — which §3.5's 25-second ping/pong already keeps from ever
      # being reached. Stated here so that a future entrypoint change is a decision rather than
      # a fleet-wide disconnect nobody attributes to it.
      framelink.socket.keepalive: "ping every 25s, dead after 60s (FRAMELINK PingInterval/PongDeadline)"

      # ── The stack's own firewall rules — INERT, AND STRUCTURALLY SO ───────────────────────
      # This label is read by exactly one thing: the generator at scripts/dfw-gen.py in the
      # operator's own repository, which walks `stacks/*.yml` there. It has never seen this file
      # and will not until a copy of it lives at stacks/framelink.yml on deployment day. Nothing
      # here is applied to any firewall today.
      #
      # This is the operator's dfw schema verbatim, not a string of this project's invention: a
      # YAML block scalar, egress scoped as internet/lan/host/intra_stack/cross_stack, ingress as
      # published_ports/cross_stack/intra_stack, and an `audit-tier` / `audit-reason` trailer that
      # is a YAML comment to the parser and the justification column in the generated report.
      #
      # The three published ports are NOT restated here, and that is deliberate: the generator
      # auto-derives a DNAT and an ingress accept from every compose `ports:` directive, because
      # the directive IS the intent. An `ingress.published_ports` entry only ever NARROWS one
      # (via allowed_sources), and narrowing the media range would break calling.
      #
      # egress.internet is scoped to 443 for one reason: the first start fetches the pinned
      # livekit-server release from GitHub. It is the estate's documented one-time-internet-need
      # shape — deny it and the container still serves, adopts and shows photos, and only calling
      # never comes up. egress.host reaches Home Assistant, which runs network_mode: host on this
      # server, so the alert webhook is a host destination and not a cross-stack pinhole.
      #
      # PINHOLES ARE SYMMETRIC AND THIS IS ONLY ONE HALF. The ingress entries below have no
      # effect until the matching `egress.cross_stack` entries naming this stack are added to
      # reverseproxy-traefik and reverseproxy-homepage in the operator's own repo; their
      # validator fails an asymmetric declaration. That edit is theirs to make.
      dfw.rules: |
        egress:
          internet: { ports: [443] }
          lan: deny
          host: { ports: [8123] }
          intra_stack: allow
          cross_stack: []
        ingress:
          cross_stack:
            - source: { stack: reverseproxy, container: reverseproxy-traefik }
              proto: tcp
              port: 8080
              comment: "Traefik ingress routing (console + the /agent websocket)"
            - source: { stack: reverseproxy, container: reverseproxy-homepage }
              proto: tcp
              port: 8080
              comment: "Homepage monitor"
            - source: { stack: reverseproxy, container: reverseproxy-homepage }
              proto: icmp
              comment: "Homepage ping tile"
        # audit-tier: 2
        # audit-reason: "One-time HTTPS fetch of the pinned livekit-server release, and the Home Assistant webhook on the host for fleet alerts; denying either leaves the console and photos working and degrades only calling and alerting (access.md Tier 2)."

    healthcheck:
      # Repeated from the image so that an operator reading only the stack can see what "healthy"
      # means here. §3.2: an unconfigured instance is healthy — it starts, serves, and explains
      # itself. Marking it unhealthy would have an orchestrator restart the one page that says why.
      test: ["CMD", "curl", "-fsS", "--max-time", "4", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        # The container log is a delivery channel for §3.5's alerts on a deployment with no
        # webhook, so it is bounded rather than disabled: three files of ten megabytes is weeks
        # of this server's output and cannot fill the disk the database is on.
        max-size: "10m"
        max-file: "3"

networks:
  # The key is `default` because the operator's firewall generator identifies a stack's own
  # bridge by that literal key and falls back to the filename otherwise; `name:` is what Docker
  # actually calls the network, so the visible name is unchanged.
  default:
    name: ${FRAMELINK_NETWORK_NAME:-framelink}
    driver: bridge
    ipam:
      config:
        # The gateway is pinned at .254 rather than left to Docker. This estate reserves .1 and
        # keeps it clear of Docker's historical default-gateway slot, so an unpinned gateway
        # would silently take an address the reservation table says is unallocated.
        - subnet: ${FRAMELINK_SUBNET}
          gateway: ${FRAMELINK_GATEWAY}

volumes:
  framelink-data:
    name: ${FRAMELINK_VOLUME:-framelink-data}
    external: true

  # Deliberately NOT external. The one line above is the most important in this file because the
  # data it names cannot be rebuilt; nothing on this one is in that position, so Compose owning it
  # is a feature — `docker compose down -v` reclaims six gigabytes of disposable image and cannot
  # reach the database while doing it. Its ownership needs no chown because /var/lib/fl-images
  # exists in the image owned by 10001; deploy/fleet-manager/Dockerfile records why.
  framelink-images:
    name: ${FRAMELINK_IMAGE_VOLUME:-framelink-images}
