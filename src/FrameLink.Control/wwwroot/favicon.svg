<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="FrameLink">
	<title>FrameLink</title>
	<!--
		The mark: a frame with a horizon in it. Drawn from the design system's ember ramp
		(--ember-300 → --ember-500) on the dark ground (--ink-1000), so the favicon is the same
		object as the header logo and the frame's own splash.
	-->
	<defs>
		<linearGradient id="ember" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#ffc570" />
			<stop offset="1" stop-color="#f79a34" />
		</linearGradient>
	</defs>
	<rect width="64" height="64" rx="14" fill="#06080c" />
	<rect x="12" y="12" width="40" height="40" rx="7" fill="none" stroke="url(#ember)" stroke-width="3.5" />
	<path
		d="M12 41l9-9 7 7 8-10 12 12"
		fill="none"
		stroke="url(#ember)"
		stroke-width="3.5"
		stroke-linecap="round"
		stroke-linejoin="round"
		opacity="0.85"
	/>
</svg>
